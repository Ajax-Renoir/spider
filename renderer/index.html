<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Spider</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    .pet {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
    }
    /* —— 漫画对白气泡 —— */
    #bubble {
      display: none;
      position: relative;
      max-width: 232px;
      background: #ffffff;
      border: 3px solid #1a1a1a;
      border-radius: 18px;
      padding: 12px 16px;
      font-family: "Microsoft YaHei", "Comic Sans MS", sans-serif;
      font-size: 15px; font-weight: 700;
      color: #1a1a1a; line-height: 1.5;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.18);
      margin-bottom: 4px;
      background-image: radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);
      background-size: 8px 8px;
    }
    #bubble.show { display: block; animation: pop 0.28s ease; }
    /* 气泡尾巴（黑描边 + 白填充） */
    #bubble::after {
      content: ''; position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%);
      border: 9px solid transparent; border-top-color: #1a1a1a;
    }
    #bubble::before {
      content: ''; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
      border: 7px solid transparent; border-top-color: #ffffff; z-index: 1;
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    /* —— 猫 —— */
    #catStage { display: flex; align-items: flex-end; justify-content: center; }
    #cat {
      width: 130px; height: auto;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    }
    #cat.walking { animation: walk 0.45s ease-in-out infinite; }
    #cat.hopping { animation: hop 0.5s ease; }
    #cat.happy { animation: happy 0.9s ease; }
    @keyframes walk {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-5deg); }
      50% { transform: translateY(-1px) rotate(0deg); }
      75% { transform: translateY(-3px) rotate(5deg); }
    }
    @keyframes hop {
      0% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(-16px) scale(1.04, 0.96); }
      65% { transform: translateY(0) scale(0.96, 1.05); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes happy {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-10px) rotate(-6deg); }
      40% { transform: translateY(0) rotate(6deg); }
      60% { transform: translateY(-8px) rotate(-4deg); }
      80% { transform: translateY(0) rotate(4deg); }
    }
  </style>
</head>
<body>
  <div class="pet" id="petWrap">
    <div id="bubble"></div>
    <div id="catStage">
      <img id="cat" src="../assets/spider-cat.png" alt="Spider" />
    </div>
  </div>

  <script>
    (function () {
      var bubble = document.getElementById('bubble');
      var catStage = document.getElementById('catStage');
      var cat = document.getElementById('cat');

      // ---- 说话气泡：显示 + 自动隐藏 ----
      var speakTimer = null;
      function speak(text) {
        if (!text) return;
        bubble.textContent = text;
        bubble.classList.remove('show');
        void bubble.offsetWidth; // 重触发动画
        bubble.classList.add('show');
        clearTimeout(speakTimer);
        speakTimer = setTimeout(function () { bubble.classList.remove('show'); }, 6000);
      }
      window.spider && window.spider.onSpeak(speak);

      // ---- 拖拽 + 点击识别 ----
      var dragging = false, downX = 0, downY = 0, moved = false;
      document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        dragging = true; downX = e.clientX; downY = e.clientY; moved = false;
        window.spider && window.spider.dragStart();
        e.preventDefault();
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) moved = true;
        window.spider && window.spider.dragMove();
      });
      window.addEventListener('mouseup', function () {
        if (!dragging) return;
        dragging = false;
        window.spider && window.spider.dragEnd();
        if (!moved) window.spider && window.spider.openChat();
      });

      // ---- 呼吸（作用在猫容器，与气泡无关）----
      var t = Math.random() * 100;
      function breathe() {
        t += 0.006;
        var sx = 1 + Math.sin(t) * 0.02 + Math.sin(t * 0.41) * 0.006;
        var rot = Math.sin(t * 0.53) * 1.2;
        catStage.style.transform = 'scale(' + sx.toFixed(4) + ') rotate(' + rot.toFixed(2) + 'deg)';
        requestAnimationFrame(breathe);
      }
      requestAnimationFrame(breathe);

      // ---- 行为动画 ----
      window.spider && window.spider.onAnim(function (type) {
        cat.classList.remove('walking', 'hopping', 'happy');
        if (type === 'walk-left' || type === 'walk-right') cat.classList.add('walking');
        else if (type === 'hop') cat.classList.add('hopping');
        else if (type === 'happy') cat.classList.add('happy');
      });
    })();
  </script>
</body>
</html>
